# Managed by deck-tailscale. Put local changes in a separate drop-in.
[Unit]
RequiresMountsFor=/home/.tailscale-bin /var/lib/tailscale

[Service]
# Defaults in EnvironmentFile still take precedence over these fallback values.
Environment=PORT=41641
Environment=TS_DEBUG_FIREWALL_MODE=auto
ExecStartPre=
ExecStartPre=/home/.tailscale-bin/current/tailscaled --cleanup
ExecStart=
ExecStart=/home/.tailscale-bin/current/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
ExecStopPost=
ExecStopPost=/home/.tailscale-bin/current/tailscaled --cleanup
